name: Scrape tee times (full)

# The twice-daily sweep: 5 days out, 08:00 and 20:00 Sydney, into Supabase.
# Days 0-2 are covered far more often by scrape-fast.yml.

on:
  schedule:
    # GitHub cron is UTC only and Sydney changes offset twice a year, so no
    # single line here can mean "08:00 and 20:00 Sydney" all year — the old
    # '0 22,10 * * *' was correct in AEST and an hour late for the five months
    # of AEDT. Instead this fires at every UTC hour that could be one of those
    # slots (10 and 22 in AEST, 09 and 21 in AEDT) and the gate step below
    # throws away the half that is not. Half of every day's fires are meant to
    # do nothing.
    #
    # scraper/cadence.py is the only thing that decides which is which, and
    # scraper/tests/test_cadence.py parses this very line to assert these
    # candidates stay a superset of what the gate accepts. Do not edit one
    # without running that suite.
    - cron: '0 9,10,21,22 * * *'
  workflow_dispatch:

# Nothing is committed any more. Slots go to Supabase, so docs/data/teetimes.json
# is no longer produced or written — see scraper/README.md.
permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Full scrape — 5 days
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A scheduled run at a UTC hour that is not a Sydney slot stops here
      # having done nothing: no pip install, no HTTP to any club, no writes.
      #
      # It records the decision as an output rather than failing the job. Half
      # of all scheduled fires are deliberate no-ops, and a red tick on a
      # no-op trains everyone to ignore the red ticks that matter.
      #
      # workflow_dispatch skips this step entirely, so a manual run always
      # scrapes — the output is then empty, which is not 'false'.
      #
      # Only exit 1 means skip. Anything else is the gate itself broken — a
      # syntax error in cadence.py, a bad argument — and that has to be loud:
      # read as a skip it would silently turn every scheduled full run into a
      # no-op and nothing would ever go red to say so.
      - name: Sydney cadence gate
        id: gate
        if: github.event_name == 'schedule'
        run: |
          set +e
          python3 scraper/cadence.py --gate full
          code=$?
          set -e
          case "$code" in
            0) echo 'run=true'  >> "$GITHUB_OUTPUT" ;;
            1) echo 'run=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "cadence gate failed with exit $code — refusing to read that as a skip" >&2
               exit "$code" ;;
          esac

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run != 'false'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        if: steps.gate.outputs.run != 'false'
        run: pip install -r scraper/requirements.txt

      # --validate gates the write: a payload that fails the frozen contract
      # is never sent to Supabase.
      - name: Scrape, validate and write to Supabase
        if: steps.gate.outputs.run != 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper/scrape.py --mode full --validate --write supabase
