name: TeesForTheBoys

# GENERATED PROJECT. ios/TeesForTheBoys.xcodeproj is a build artefact and is
# gitignored — this file is the project. Run ./scripts/xcgen.sh (never
# xcodegen directly; the wrapper holds a lock so concurrent agents cannot
# corrupt the project).
#
# Why five frameworks instead of one app target: Stage 1 runs five tracks at
# once in this working tree. Separate targets mean a track's gate builds only
# its own code, and the compiler — not a house rule — enforces the module
# boundary. Anything one track needs from another has to be `public`, which
# makes the seams visible instead of accidental.

options:
  bundleIdPrefix: code.lawro
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.2

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targetTemplates:
  Module:
    type: framework
    platform: iOS
    settings:
      base:
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ${target_name}
  ModuleTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

targets:

  # --- Stage 0. Frozen. Nobody edits this during Stage 1. -------------------
  TeesContract:
    templates: [Module]
    sources:
      - TeesForTheBoys/Contract
      # The fixtures are referenced where they are generated, not copied. One
      # source of truth: regenerate contract/fixtures and the app sees it.
      - path: ../contract/fixtures/minimal.json
        buildPhase: resources
        group: Fixtures
      - path: ../contract/fixtures/golden.json
        buildPhase: resources
        group: Fixtures

    scheme:
      testTargets:
        - TeesContractTests

  TeesContractTests:
    templates: [ModuleTests]
    sources: [TeesForTheBoysTests/Contract]
    dependencies:
      - target: TeesContract
    settings:
      base:
        TEST_HOST: ""

  # --- Track D. Tokens and shared components. No screens. -------------------
  TeesDesign:
    templates: [Module]
    sources: [TeesForTheBoys/DesignSystem]
    dependencies:
      - target: TeesContract

    scheme:
      testTargets:
        - TeesDesignTests

  TeesDesignTests:
    templates: [ModuleTests]
    sources: [TeesForTheBoysTests/DesignSystem]
    dependencies:
      - target: TeesDesign
      - target: TeesContract

  # --- Track B. Supabase, auth, cache. No SwiftUI. --------------------------
  TeesData:
    templates: [Module]
    sources: [TeesForTheBoys/Data]
    dependencies:
      - target: TeesContract
      - package: Supabase
        product: Supabase

    scheme:
      testTargets:
        - TeesDataTests

  TeesDataTests:
    templates: [ModuleTests]
    sources: [TeesForTheBoysTests/Data]
    dependencies:
      - target: TeesData
      - target: TeesContract
      # The test files import Supabase's Auth/Helpers error types directly
      # to build fixtures (AuthError, PostgrestError, HTTPError) — that
      # requires its own link, not just TeesData's. Riding on TeesData's
      # link worked by accident in the module-only TeesData scheme but
      # broke once this bundle ran inside the combined TeesForTheBoys
      # scheme, which doesn't happen to re-expose it the same way.
      - package: Supabase
        product: Supabase

  # --- Track C. Screens. Fixture-driven, no network. ------------------------
  TeesViews:
    templates: [Module]
    sources: [TeesForTheBoys/Views]
    dependencies:
      - target: TeesContract
      - target: TeesDesign

    scheme:
      testTargets:
        - TeesViewsTests

  TeesViewsTests:
    templates: [ModuleTests]
    sources: [TeesForTheBoysTests/Views]
    dependencies:
      - target: TeesViews
      - target: TeesDesign
      - target: TeesContract

  # --- Track E. Matcher client and APNs registration. -----------------------
  TeesPush:
    templates: [Module]
    sources: [TeesForTheBoys/Push]
    dependencies:
      - target: TeesContract

    scheme:
      testTargets:
        - TeesPushTests

  TeesPushTests:
    templates: [ModuleTests]
    sources: [TeesForTheBoysTests/Push]
    dependencies:
      - target: TeesPush
      - target: TeesContract

  # --- The app. Stage 0 scaffolds it; Stage 2 wires it together. ------------
  TeesForTheBoys:
    type: application
    platform: iOS
    sources:
      # Listed as ordinary sources, NOT as a folder reference. A folder
      # reference copies empty directories into the bundle, and an empty
      # directory in an .app makes `simctl install` fail with the
      # spectacularly unhelpful "Missing bundle ID".
      - TeesForTheBoys/App
      - TeesForTheBoys/Resources
    dependencies:
      - target: TeesContract
        embed: true
      - target: TeesDesign
        embed: true
      - target: TeesData
        embed: true
      - target: TeesViews
        embed: true
      - target: TeesPush
        embed: true
      - package: Supabase
        product: Supabase
    info:
      path: TeesForTheBoys/App/Info.plist
      properties:
        CFBundleDisplayName: Tees
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Same dev-project URL and anon (publishable) key as the `run` scheme's
        # environment variables below — Xcode only sets those when it launches
        # the app itself. A standalone install on a device (tap the icon, no
        # cable) has no scheme env, so SupabaseConfiguration.resolve() falls
        # through to these Info.plist keys instead. Not a secret: see the note
        # on the scheme's environmentVariables below.
        TeesSupabaseURL: https://ipzhqvsyxyjndpbmpibw.supabase.co
        TeesSupabaseAnonKey: sb_publishable_hWDRhTPRgPBSgmHvuzlEWQ_P6TDcWiA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: code.lawro.TeesForTheBoys
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K2S7K79DZB

  # The composition root's own tests. Every other target above tests a track
  # in isolation; nothing tested Stage 2 assembly itself — `AppSession`,
  # `AppDelegate`, `TeesForTheBoysApp` — because nothing could: they are the
  # one place both `TeesPush` and `TeesViews` are visible at once, so a test
  # for them has to be hosted by the app that imports both. `TEST_HOST` is
  # what makes `@testable import TeesForTheBoys` link at all against an
  # application target rather than a framework.
  TeesForTheBoysAppTests:
    templates: [ModuleTests]
    sources: [TeesForTheBoysTests/App]
    dependencies:
      - target: TeesForTheBoys
      - target: TeesContract
      - target: TeesData
      - target: TeesViews
      - target: TeesPush
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TeesForTheBoys.app/TeesForTheBoys"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TeesForTheBoys:
    build:
      targets:
        TeesForTheBoys: all
    test:
      gatherCoverageData: false
      targets:
        [TeesContractTests, TeesDesignTests, TeesDataTests, TeesViewsTests, TeesPushTests, TeesForTheBoysAppTests]
    run:
      # Stage 2. The dev project's URL and anon (publishable) key — see
      # `SupabaseConfiguration`'s precedence: the environment beats
      # Info.plist. Neither value is a secret: the anon key is meant to sit
      # in a client binary and every table it can touch is behind RLS
      # (supabase/migrations/0004_rls.sql). The service role key is a
      # different matter and does not belong anywhere in this repo.
      environmentVariables:
        - variable: TEES_SUPABASE_URL
          value: https://ipzhqvsyxyjndpbmpibw.supabase.co
        - variable: TEES_SUPABASE_ANON_KEY
          value: sb_publishable_hWDRhTPRgPBSgmHvuzlEWQ_P6TDcWiA
